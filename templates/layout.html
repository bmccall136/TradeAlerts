{# templates/layout.html #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}🚀 TradeAlerts 🚀{% endblock %}</title>

  <!-- 1) Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- 2) Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- 3) App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

  {% block head %}{% endblock %}
</head>
<body class="black-bg text-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black py-2 position-relative">
    <div class="container-fluid">

      <!-- Left: primary nav -->
	<div class="d-flex align-items-center mb-3">
	  <div id="live-mode-toggle" class="btn-group btn-group-sm" role="group" aria-label="Trade mode">
		<button type="button" class="btn btn-outline-warning" data-mode="DAY">Day Trader</button>
		<button type="button" class="btn btn-outline-secondary" data-mode="SWING">Swing Trader</button>
	  </div>
	</div>

      <!-- Center: big title -->
      <div class="trade-alerts-title position-absolute top-50 start-50 translate-middle text-center">
        🚀 <b>TradeAlerts</b> 🚀
      </div>

      <!-- Right: actions -->
      <div class="d-flex align-items-center gap-2 ms-auto">
        <!-- Checkpoint -->
		<form action="{{ url_for('run_checkpoint') }}" method="get" class="m-0">
		  <button class="btn btn-small">✅ Checkpoint</button>
		</form>

        <!-- Reconnect API -->
        <a class="btn btn-sm btn-outline-warning btn-fixed"
           href="{{ url_for('etrade_reconnect') }}">
          🔁 Reconnect API
        </a>
      </div>

    </div>
  </nav>

  <!-- MAIN -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
<script>
// --- Day Trader / Swing Trader mode toggle ---
function refreshModeButtons(mode) {
  const group = document.getElementById('live-mode-toggle');
  if (!group) return;

  const buttons = group.querySelectorAll('button[data-mode]');
  buttons.forEach(btn => {
    const m = btn.getAttribute('data-mode');
    if (m === mode) {
      // Active mode: solid highlight
      btn.classList.remove('btn-outline-secondary');
      btn.classList.add('btn-warning');
    } else {
      // Inactive mode: outline
      btn.classList.remove('btn-warning');
      btn.classList.add('btn-outline-secondary');
    }
  });
}

function loadLiveMode() {
  fetch('/live/mode')
    .then(r => r.json())
    .then(data => {
      if (!data || !data.ok) return;
      refreshModeButtons((data.mode || 'DAY').toUpperCase());
    })
    .catch(err => console.error('[LIVE] mode fetch failed', err));
}

function initLiveModeToggle() {
  const group = document.getElementById('live-mode-toggle');
  if (!group) return;

  group.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-mode]');
    if (!btn) return;

    const mode = btn.getAttribute('data-mode');
    fetch(`/live/mode?set=${encodeURIComponent(mode)}`)
      .then(r => r.json())
      .then(data => {
        if (!data || !data.ok) return;
        refreshModeButtons((data.mode || 'DAY').toUpperCase());
        // Optional: reload the page to have scanner/sell_guard pick up new mode
        // location.reload();
      })
      .catch(err => console.error('[LIVE] mode set failed', err));
  });

  loadLiveMode();
}
</script>
