
{% extends "layout.html" %}
{% block content %}
<style>
  .mm-card { background:#0f1118; border:1px solid #222531; border-radius:10px; }
  .mm-muted { opacity:.82; }
  .mm-stickybar {
    position: sticky; top: 10px; z-index: 50;
    background: rgba(15,17,24,.95);
    border: 1px solid #222531;
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(6px);
  }
  .mm-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .mm-gate-grid {
    display:grid;
    grid-template-columns: repeat(8, minmax(120px, 1fr));
    gap: 8px 10px;
  }
  @media (max-width: 1200px) { .mm-gate-grid { grid-template-columns: repeat(4, minmax(140px, 1fr)); } }
  @media (max-width: 700px)  { .mm-gate-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); } }

  .mm-gate-pill {
    display:flex; align-items:center; gap:8px;
    border:1px solid #262a38; border-radius:10px; padding:6px 8px;
    background:#0b0d14;
  }
  .mm-gate-pill input { transform: scale(1.05); }

  .mm-cards { display:flex; flex-direction:column; gap:10px; }
  details.mm-ind { border:1px solid #222531; border-radius:10px; background:#0b0d14; }
  details.mm-ind[open] { background:#0f1118; }
  details.mm-ind > summary {
    list-style:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px;
  }
  details.mm-ind > summary::-webkit-details-marker { display:none; }
  .mm-title { font-weight:800; }
  .mm-right { display:flex; align-items:center; gap:10px; }
  .mm-count { font-size:12px; opacity:.85; }

  .mm-body { padding: 8px 12px 12px 12px; border-top:1px solid #222531; }
  .mm-grid {
    display:grid;
    grid-template-columns: 1fr 220px;
    gap: 8px 12px;
    align-items:center;
  }
  @media (max-width: 700px) { .mm-grid { grid-template-columns: 1fr; } }

  .mm-grid label { opacity:.9; }
  .mm-grid input[type="text"], .mm-grid input[type="number"], .mm-grid select {
    width:100%;
    background:#0b0d14;
    border:1px solid #262a38;
    border-radius:8px;
    color:#e8e8e8;
    padding:6px 8px;
  }
  .mm-toggle {
    display:flex; align-items:center; gap:8px;
    border:1px solid #262a38; border-radius:10px; padding:6px 8px;
    background:#0b0d14;
  }
  .mm-section-title { font-size:18px; font-weight:800; margin-bottom:6px; }
  .mm-subtitle { margin-top:0; margin-bottom:10px; }
  .mm-divider { height:1px; background:#222531; margin: 14px 0; }

  /* Other Settings: make left-column labels readable */
  #otherCard .mm-grid label {
    opacity: 0.95;
    color: #d7dbe6;
    font-weight: 700;
  }
  #otherCard .mm-muted { opacity: 0.9; }

  /* Other Settings: match card tone + checkbox accent */
  #otherCard { background: rgba(17,21,28,0.78); }
  #otherCard .card-body { background: transparent; }
  #otherCard .mm-section-title { color: #e9edf6; }
  #otherCard input[type="checkbox"] { accent-color: #f5d400; }
  /* Some browsers still draw blue focus ring; neutralize */
  #otherCard input[type="checkbox"]:focus { outline: none; box-shadow: 0 0 0 2px rgba(245,212,0,0.25); }
</style>

<div id="settings-page" class="container-fluid" style="max-width:1100px;margin-left:auto;margin-right:auto;">
  <div class="d-flex align-items-center justify-content-between" style="margin:18px 0 10px 0;">
    <div style="font-size:22px;font-weight:800;">Settings</div>
    <div class="d-flex align-items-center" style="gap:10px;">
      <div class="btn-group" role="group" aria-label="settings tabs">
        <a class="btn btn-sm btn-dark" href="/settings/buy">BUY</a>
        <a class="btn btn-sm btn-warning" href="/settings/sell">SELL</a>
      </div>
      <div class="d-flex align-items-center" style="gap:8px;">
        <div style="opacity:.85;">Profile</div>
        <select id="profileSel" class="form-select form-select-sm" style="width:130px;">
          <option value="day">DAY</option>
          <option value="swing">SWING</option>
        </select>
      </div>
    </div>
  </div>

  <div class="mm-stickybar mb-3">
    <div class="mm-row">
      <div class="mm-muted">Editing: <b id="stickyGroup">SELL</b> / <b id="stickyProfile">DAY</b></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="saveBtnTop" class="btn btn-warning">Save</button>
        <div id="saveMsgTop" class="mm-muted"></div>
      </div>
    </div>
  </div>
</div>
  </div>



  <div class="card mm-card mb-3">
    <div class="card-body">
      <div class="mm-section-title">Sell Modules</div>
      <div class="mm-muted mm-subtitle">Each section can be expanded/collapsed. Enable controls eligibility; settings live inside each card.</div>
      <div id="indicatorCards" class="mm-cards"></div>
</div>
    </div>
  </div>

  <div id="otherCard" class="card mm-card mb-3" style="display:none; max-width:1100px; margin-left:auto; margin-right:auto;">
    <div class="card-body">
      <div class="mm-section-title">Other Settings</div>
      <div class="mm-muted mm-subtitle">Everything that is not an indicator lives here.</div>
      <div id="otherFields" class="mm-grid"></div>
    </div>
  </div>
</div>

<script>
  window.__MM_GROUP__ = "sell";
  window.__MM_CFG__ = {
    cards: [{"key": "ai", "label": "AI Advisor", "enable_key": null, "enable_is_field": false, "fields": [{"k": "ai.enabled", "label": "Enabled", "type": "bool", "optional": false}, {"k": "ai.use_entries", "label": "Use Entries", "type": "bool", "optional": false}, {"k": "ai.use_exits", "label": "Use Exits", "type": "bool", "optional": false}]}, {"key": "sell_guard_core", "label": "Sell Guard Core", "enable_key": null, "enable_is_field": false, "fields": [{"k": "sell_guard.mode", "label": "Mode", "type": "text", "optional": true}, {"k": "sell_guard.interval_sec", "label": "Interval Secs", "type": "number", "optional": true}, {"k": "sell_guard.sell_window_start_et", "label": "Sell Window Start (ET)", "type": "text", "optional": true}, {"k": "sell_guard.sell_window_end_et", "label": "Sell Window End (ET)", "type": "text", "optional": true}, {"k": "sell_guard.use_extended_hours", "label": "Use Extended Hours", "type": "bool", "optional": true}, {"k": "sell_guard.throttle_ms", "label": "Throttle ms", "type": "number", "optional": true}]}, {"key": "targets", "label": "Targets & Stops", "enable_key": null, "enable_is_field": false, "fields": [{"k": "target_gain_pct", "label": "Target Gain % (top)", "type": "number", "optional": true}, {"k": "sell_guard.target_gain_pct", "label": "Target Gain %", "type": "number", "optional": true}, {"k": "sell_guard.target_bps", "label": "Target bps", "type": "number", "optional": true}, {"k": "sell_guard.stop_bps", "label": "Stop bps", "type": "number", "optional": true}, {"k": "timeout_exit_pct", "label": "Timeout Exit % (top)", "type": "number", "optional": true}, {"k": "sell_guard.timeout_exit_pct", "label": "Timeout Exit %", "type": "number", "optional": true}, {"k": "sell_guard.allow_intraday_stoploss", "label": "Allow Intraday Stop", "type": "bool", "optional": true}, {"k": "sell_guard.intraday_stoploss_pct", "label": "Intraday Stop %", "type": "number", "optional": true}]}, {"key": "timeouts", "label": "Timeout / Hold", "enable_key": null, "enable_is_field": false, "fields": [{"k": "enable_timeout_exits", "label": "Enable Timeout Exits (top)", "type": "bool", "optional": true}, {"k": "sell_guard.enable_timeout_exits", "label": "Enable Timeout Exits", "type": "bool", "optional": true}, {"k": "max_hold_minutes", "label": "Max Hold Minutes (top)", "type": "number", "optional": true}, {"k": "sell_guard.max_hold_minutes", "label": "Max Hold Minutes", "type": "number", "optional": true}, {"k": "sell_after_days", "label": "Sell After Days (top)", "type": "number", "optional": true}, {"k": "sell_guard.min_hold_minutes", "label": "Min Hold Minutes", "type": "number", "optional": true}, {"k": "sell_guard.min_hold_days", "label": "Min Hold Days", "type": "number", "optional": true}]}, {"key": "protect", "label": "Protect / Trailing", "enable_key": null, "enable_is_field": false, "fields": [{"k": "trail_arm_gain_pct", "label": "Trail Arm Gain % (top)", "type": "number", "optional": true}, {"k": "sell_guard.trail_arm_gain_pct", "label": "Trail Arm Gain %", "type": "number", "optional": true}, {"k": "trail_backoff_pct", "label": "Trail Backoff % (top)", "type": "number", "optional": true}, {"k": "sell_guard.trail_backoff_pct", "label": "Trail Backoff %", "type": "number", "optional": true}, {"k": "sell_guard.protect_min_gain_pct", "label": "Protect Min Gain %", "type": "number", "optional": true}, {"k": "sell_guard.protect_trail_arm_pct", "label": "Protect Trail Arm %", "type": "number", "optional": true}, {"k": "sell_guard.protect_trail_pct", "label": "Protect Trail %", "type": "number", "optional": true}, {"k": "sell_guard.sell_protect_after_mins", "label": "Protect After Mins", "type": "number", "optional": true}]}, {"key": "filters", "label": "Filters / Safety", "enable_key": null, "enable_is_field": false, "fields": [{"k": "sell_guard.blocklist", "label": "Blocklist (comma)", "type": "text", "optional": true}, {"k": "sell_guard.only_allow_symbol", "label": "Only Allow Symbol", "type": "text", "optional": true}, {"k": "sell_guard.avoid_daytrades", "label": "Avoid Daytrades", "type": "bool", "optional": true}, {"k": "sell_guard.pdt_allow_stop", "label": "PDT Allow Stop", "type": "bool", "optional": true}, {"k": "sell_guard.max_place_attempts", "label": "Max Place Attempts", "type": "number", "optional": true}, {"k": "sell_guard.normalize_tick", "label": "Normalize Tick", "type": "bool", "optional": true}]}],
    other: [],
    gate: []
  };
</script>

<script>
(() => {
  const GROUP = (window.__MM_GROUP__ || "sell");
  const CFG = window.__MM_CFG__ || { cards:[], other:[], gate:[] };
  const byId = (id) => document.getElementById(id);

  let SETTINGS = {};
  let SCORE = {};

  function normProfile(v){
    v = String(v||"").toLowerCase();
    return (v === "swing") ? "swing" : "day";
  }

  function groupKey(k){
    k = String(k||"").toLowerCase().replace(/\s+/g,"");
    if (k.includes("price_sma")) return "price_sma";
    if (k.includes("bb_break")) return "bb_break";
    if (k.includes("atr_pct")) return "atr_pct";
    if (k.includes("macd_hist")) return "macd_hist";
    if (k === "sma20") return "sma20";
    if (k.startsWith("sma")) return "sma";
    if (k.startsWith("rsi")) return "rsi";
    if (k.startsWith("macd")) return "macd";
    if (k.startsWith("vwap")) return "vwap";
    if (k.startsWith("vol") || k.startsWith("volume")) return "vol";
    if (k.startsWith("range")) return "range";
    if (k.startsWith("gap")) return "gap";
    if (k.startsWith("bb")) return "bb";
    if (k.startsWith("atr")) return "atr";
    if (k.startsWith("adx")) return "adx";
    if (k.startsWith("super")) return "super";
    return k;
  }

  function scoreCount(key){
    const g = groupKey(key);
    const v = (SCORE || {})[g];
    const n = Number(v || 0);
    return Number.isFinite(n) ? n : 0;
  }

  async function apiLoad(profile){
    const r = await fetch(`/api/settings/load?group=${encodeURIComponent(GROUP)}&profile=${encodeURIComponent(profile)}`, { cache:"no-store" });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) ? j.error : "load failed");
    return (j.data && typeof j.data === "object") ? j.data : {};
  }

  async function apiSave(profile, data){
    const r = await fetch(`/api/settings/save?group=${encodeURIComponent(GROUP)}&profile=${encodeURIComponent(profile)}`, {
      method:"POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(data || {})
    });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) ? j.error : "save failed");
    return j;
  }

  async function apiScore(bucket){
    const r = await fetch(`/api/settings/scoreboard?bucket=${encodeURIComponent(bucket)}`, { cache:"no-store" });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) ? j.error : "scoreboard failed");
    return j.counts || {};
  }

  function getPath(obj, path){
    const parts = String(path||"").split(".");
    let cur = obj;
    for (const p of parts){
      if (!cur || typeof cur !== "object") return undefined;
      cur = cur[p];
    }
    return cur;
  }

  function setPath(obj, path, value){
    const parts = String(path||"").split(".");
    let cur = obj;
    for (let i=0;i<parts.length;i++){
      const p = parts[i];
      if (i === parts.length-1){
        cur[p] = value;
      } else {
        if (!cur[p] || typeof cur[p] !== "object") cur[p] = {};
        cur = cur[p];
      }
    }
  }

  function renderScoreboard(){
    const host = byId("scoreboardCards");
    if (!host) return;
    host.innerHTML = "";

    const items = (CFG.cards || []).map(c => {
      return {
        key: c.key,
        label: c.label,
        enabled: getEnable(c),
        count: scoreCount(c.key)
      };
    }).sort((a,b) => (b.count - a.count));

    for (const it of items){
      const div = document.createElement("div");
      div.className = "mm-gate-pill";
      div.style.justifyContent = "space-between";
      div.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-weight:800;">${it.label}</div>
          <div class="mm-count">count: ${it.count}</div>
        </div>
        <div class="mm-count">${it.enabled ? "Enabled" : "Disabled"}</div>
      `;
      host.appendChild(div);
    }
  }

  function renderGate(){
    const host = byId("gateGrid");
    if (!host) return;
    host.innerHTML = "";

    let required = SETTINGS.required_filters;
    if (!Array.isArray(required)) required = [];
    const reqSet = new Set(required.map(x => String(x||"").toLowerCase()));

    for (const g of (CFG.gate || [])){
      const pill = document.createElement("div");
      pill.className = "mm-gate-pill";
      const id = `gate_${g.key}`;
      const checked = reqSet.has(String(g.key).toLowerCase());
      pill.innerHTML = `
        <input type="checkbox" id="${id}" ${checked ? "checked" : ""}>
        <label for="${id}" style="margin:0;font-weight:800;">${g.label}</label>
      `;
      pill.querySelector("input").onchange = (e) => {
        const on = !!e.target.checked;
        const key = String(g.key).toLowerCase();
        let arr = Array.isArray(SETTINGS.required_filters) ? SETTINGS.required_filters.slice() : [];
        arr = arr.map(x => String(x||"").toLowerCase());
        const s = new Set(arr);
        if (on) s.add(key); else s.delete(key);
        SETTINGS.required_filters = Array.from(s);
        const hint = byId("gateHint");
        if (hint) hint.textContent = "Required: " + (SETTINGS.required_filters.length ? SETTINGS.required_filters.join(", ") : "(none)");
      };
      host.appendChild(pill);
    }
    const hint = byId("gateHint");
    if (hint) hint.textContent = "Required: " + (reqSet.size ? Array.from(reqSet).join(", ") : "(none)");
  }

  function getEnable(card){
    if (card.enable_is_field){
      return !!SETTINGS[card.enable_key];
    }
    if (!card.enable_key) return true;
    return !!SETTINGS[card.enable_key];
  }

  function setEnable(card, v){
    if (card.enable_is_field){
      SETTINGS[card.enable_key] = !!v;
      return;
    }
    if (!card.enable_key) return;
    SETTINGS[card.enable_key] = !!v;
  }

  function renderCards(){
    const host = byId("indicatorCards");
    if (!host) return;
    host.innerHTML = "";

    for (const card of (CFG.cards || [])){
      const det = document.createElement("details");
      det.className = "mm-ind";
      det.open = true;

      const enabled = getEnable(card);
      const cnt = scoreCount(card.key);

      const sum = document.createElement("summary");

      const enableHtml = card.enable_key ? `
        <label class="mm-toggle" onclick="event.stopPropagation();">
          <input type="checkbox" ${enabled ? "checked" : ""} style="transform:scale(1.05);">
          <span style="font-weight:800;">Enabled</span>
        </label>
      ` : ``;

      sum.innerHTML = `
        <div class="mm-title">${card.label}</div>
        <div class="mm-right">
          <div class="mm-count">count: ${cnt}</div>
          ${enableHtml}
        </div>
      `;
      det.appendChild(sum);

      const body = document.createElement("div");
      body.className = "mm-body";
      const grid = document.createElement("div");
      grid.className = "mm-grid";

      for (const f of (card.fields || [])){
        const key = f.k;
        const label = f.label || key;
        const type = f.type || "text";
        const optional = !!f.optional;

        const existing = key.includes(".") ? (getPath(SETTINGS, key) !== undefined) : (SETTINGS[key] !== undefined);
        if (optional && !existing) continue;

        const rowLabel = document.createElement("label");
        rowLabel.textContent = label;

        let input;
        if (type === "bool"){
          input = document.createElement("input");
          input.type = "checkbox";
          input.checked = !!(key.includes(".") ? getPath(SETTINGS, key) : SETTINGS[key]);
          input.onchange = () => {
            const v = !!input.checked;
            if (key.includes(".")) setPath(SETTINGS, key, v);
            else SETTINGS[key] = v;
          };
        } else {
          input = document.createElement("input");
          input.type = (type === "number") ? "number" : "text";
          const v = key.includes(".") ? getPath(SETTINGS, key) : SETTINGS[key];
          input.value = (v === undefined || v === null) ? "" : String(v);
          input.oninput = () => {
            const val = (type === "number") ? Number(input.value) : input.value;
            if (key.includes(".")) setPath(SETTINGS, key, val);
            else SETTINGS[key] = val;
          };
        }

        const box = document.createElement("div");
        box.appendChild(input);

        grid.appendChild(rowLabel);
        grid.appendChild(box);
      }

      body.appendChild(grid);
      det.appendChild(body);
      host.appendChild(det);

      if (card.enable_key){
        const chk = sum.querySelector('input[type="checkbox"]');
        if (chk){
          chk.onchange = () => {
            setEnable(card, !!chk.checked);
            renderScoreboard();
          };
        }
      }
    }
  }

  function renderOther(){
    const host = byId("otherFields");
    if (!host) return;
    host.innerHTML = "";

    for (const f of (CFG.other || [])){
      const key = f.k;
      const label = f.label || key;
      const type = f.type || "text";
      const optional = !!f.optional;

      const existing = SETTINGS[key] !== undefined;
      if (optional && !existing) continue;

      const rowLabel = document.createElement("label");
      rowLabel.textContent = label;

      let input;
      if (type === "bool"){
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!SETTINGS[key];
        input.onchange = () => SETTINGS[key] = !!input.checked;
      } else {
        input = document.createElement("input");
        input.type = (type === "number") ? "number" : "text";
        const v = SETTINGS[key];
        input.value = (v === undefined || v === null) ? "" : String(v);
        input.oninput = () => SETTINGS[key] = (type === "number") ? Number(input.value) : input.value;
      }

      const box = document.createElement("div");
      box.appendChild(input);

      host.appendChild(rowLabel);
      host.appendChild(box);
    }
  }

  async function refreshAll(){
    const prof = normProfile(byId("profileSel")?.value || "day");
    byId("stickyProfile").textContent = prof.toUpperCase();
    byId("stickyGroup").textContent = GROUP.toUpperCase();

    try {
      SETTINGS = await apiLoad(prof);
    } catch(e) {
      console.error(e);
      SETTINGS = {};
    }

    if (!SETTINGS.ai || typeof SETTINGS.ai !== "object") {
      SETTINGS.ai = { enabled:false, use_entries:false, use_exits:false };
    }

    try {
      SCORE = await apiScore(byId("bucketSel")?.value || "today");
      const err = byId("scoreErr");
      if (err) err.style.display = "none";
    } catch(e) {
      console.error(e);
      SCORE = {};
      const err = byId("scoreErr");
      if (err) {
        err.textContent = "Scoreboard unavailable";
        err.style.display = "block";
      }
    }

    renderScoreboard();
    renderGate();
    renderCards();
    renderOther();
  }

  async function doSave(){
    const prof = normProfile(byId("profileSel")?.value || "day");
    const msg1 = byId("saveMsg");
    const msg2 = byId("saveMsgTop");
    if (msg1) msg1.textContent = "Saving...";
    if (msg2) msg2.textContent = "Saving...";
    try {
      await apiSave(prof, SETTINGS);
      if (msg1) msg1.textContent = "Saved.";
      if (msg2) msg2.textContent = "Saved.";
      setTimeout(() => { if (msg1) msg1.textContent = ""; if (msg2) msg2.textContent = ""; }, 1500);
    } catch(e) {
      console.error(e);
      if (msg1) msg1.textContent = "Save failed.";
      if (msg2) msg2.textContent = "Save failed.";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const profileSel = byId("profileSel");
if (profileSel) profileSel.onchange = refreshAll;
const saveBtnTop = byId("saveBtnTop");
if (saveBtnTop) saveBtnTop.onclick = doSave;

    refreshAll();
  });
})();
</script>
